[project]
name = "tower_site_execution"
authors = [
    { name = "Sanvidhi Tech Pvt. Ltd.", email = "info@sanvidhitech.com" }
]
description = "Site-wise execution, TAT, DSR, JMR and costing for telecom tower subcontractors (Indus Towers TSPs) on ERPNext"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
